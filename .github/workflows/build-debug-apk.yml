name: Build MobileTina Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/debug-apk-build
      - agent/mobiletina-automation-v1
      - agent/mobiletina-redesign-v2

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      # Keep the current AndroidLibXrayLite wrapper/API surface used by MobileTina,
      # but pin only its xray-core dependency to the exact revision used by v2rayNG 2.0.15.
      # This isolates the Real Delay engine regression without downgrading the Android wrapper.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache: true
          cache-dependency-path: AndroidLibXrayLite/go.sum

      - name: Build current AndroidLib wrapper with 2.0.15 Xray core
        run: |
          cd ${{ github.workspace }}/AndroidLibXrayLite
          go mod edit -require=github.com/xtls/xray-core@v1.260123.1-0.20260206094241-12ee51e4bb1d
          go mod tidy
          echo "Pinned xray-core:"
          go list -m github.com/xtls/xray-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$HOME/go/bin"
          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          gomobile init
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
          test -f libv2ray.aar
          cp -f libv2ray.aar ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: V2rayNG/**/*.gradle*

      - name: Build MobileTina debug APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug

      - name: Upload MobileTina APKs
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MobileTina-debug-apks
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
