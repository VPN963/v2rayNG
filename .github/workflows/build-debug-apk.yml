name: Build MobileTina Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/debug-apk-build
      - agent/mobiletina-automation-v1
      - agent/mobiletina-redesign-v2

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Apply v2rayNG 2.0.15 TCP HTTP header compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreOutboundBuilder.kt')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    private fun createTcpHttpRequest\(\n.*?\n    \}\n\n(?=    /\*\*\n     \* Configures transport settings)',
              re.S,
          )
          replacement = '''    private fun createTcpHttpRequest(
              host: String?,
              path: String?
          ): OutboundBean.StreamSettingsBean.TcpSettingsBean.HeaderBean.RequestBean {
              // v2rayNG 2.0.15 compatibility: preserve only URI-provided Host/path.
              val request = OutboundBean.StreamSettingsBean.TcpSettingsBean.HeaderBean.RequestBean()
              request.headers.Host = host.orEmpty().split(",").map { it.trim() }.filter { it.isNotEmpty() }
              request.path = path.orEmpty().split(",").map { it.trim() }.filter { it.isNotEmpty() }
              return request
          }

          '''

          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one createTcpHttpRequest block, found {count}; refusing unsafe patch')

          path.write_text(patched, encoding='utf-8')
          print('Applied legacy TCP/HTTP request generation compatibility patch')
          PY

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: V2rayNG/**/*.gradle*

      - name: Build MobileTina debug APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug

      - name: Upload MobileTina APKs
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MobileTina-debug-apks
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
