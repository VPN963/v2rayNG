name: Build Ghajar VPN Debug APK

on:
  push:
    branches:
      - ghajar-royal-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build libhevtun
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve Xray library tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build F-Droid debug APK
        shell: bash
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          set +e
          ./gradlew assembleFdroidDebug --stacktrace --console=plain 2>&1 | tee /tmp/ghajar-gradle.log
          status=${PIPESTATUS[0]}
          echo "---- Ghajar Gradle diagnostic ----"
          grep -E -A5 -B5 '(^e: |FAILURE:|What went wrong:|Execution failed|Unresolved reference|error:|AAPT:|Android resource linking failed|Compilation error|Duplicate resources)' /tmp/ghajar-gradle.log | tail -n 240 || true
          exit $status

      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghajar-build-diagnostic
          path: /tmp/ghajar-gradle.log
          if-no-files-found: ignore

      - name: Upload Ghajar APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GhajarVPN-debug-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      - name: Prepare direct-download release files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          apks=("${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/"*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK files found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            arch="${base##*-fdroid_}"
            cp "$apk" "release-assets/GhajarVPN-${arch}"
          done

          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
          cat > release-assets/INSTALL.txt <<'EOF'
          Ghajar VPN installation guide

          Recommended for most recent Android phones:
          - GhajarVPN-arm64-v8a.apk

          For older/32-bit ARM Android phones:
          - GhajarVPN-armeabi-v7a.apk

          If you are not sure which architecture your phone uses:
          - GhajarVPN-universal.apk

          If Android says the app conflicts with an existing package, uninstall the old v2rayNG/Ghajar VPN build first, then install this build.
          EOF

          echo "Release files:"
          ls -lh release-assets

      - name: Publish APKs directly to GitHub Releases
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ghajar-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ghajar VPN Build ${GITHUB_RUN_NUMBER}" \
            --notes "Direct APK downloads for Ghajar VPN. For most Android phones use GhajarVPN-arm64-v8a.apk; if that does not install, use GhajarVPN-universal.apk or GhajarVPN-armeabi-v7a.apk. Source code ZIP/TAR is automatically attached by GitHub."
