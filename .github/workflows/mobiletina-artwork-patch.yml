name: MobileTina artwork integration patch

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-artwork-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Apply supplied artwork
        run: python3 .github/scripts/mobiletina_artwork_patch.py

      - name: Validate and commit
        run: |
          set -euo pipefail
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main/res/layout/activity_main.xml \
                  V2rayNG/app/src/main/res/layout/nav_header.xml \
                  V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use supplied artwork for MobileTina controls"
          git push origin HEAD:agent/mobiletina-2.0.15-base
