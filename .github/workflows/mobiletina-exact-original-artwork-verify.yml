name: Verify exact original MobileTina artwork

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/staging/Photo.zip
      - .github/workflows/mobiletina-exact-original-artwork-verify.yml

permissions:
  contents: write

jobs:
  exact-artwork-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobiletina-2.0.15-base
          submodules: recursive
          fetch-depth: 0

      - name: Restore exact user artwork without conversion
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/staging/Photo.zip
          echo '154d8204f0a3b4db792387fbd8d0c78f07038a84ca2a2f69d04e5767e87e6467  .github/staging/Photo.zip' | sha256sum -c -

          rm -rf /tmp/mobiletina-artwork
          mkdir -p /tmp/mobiletina-artwork
          unzip -j .github/staging/Photo.zip -d /tmp/mobiletina-artwork

          echo 'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7  /tmp/mobiletina-artwork/nav.png' | sha256sum -c -
          echo '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9  /tmp/mobiletina-artwork/red.png' | sha256sum -c -
          echo '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc  /tmp/mobiletina-artwork/stop.webp' | sha256sum -c -
          echo '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903  /tmp/mobiletina-artwork/white.png' | sha256sum -c -
          echo 'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c  /tmp/mobiletina-artwork/yellow.png' | sha256sum -c -
          echo 'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026  /tmp/mobiletina-artwork/fab.webp' | sha256sum -c -
          echo '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89  /tmp/mobiletina-artwork/blue.png' | sha256sum -c -

          mkdir -p V2rayNG/app/src/main/res/drawable-nodpi
          rm -f V2rayNG/app/src/main/res/drawable/mt_auto_white.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_auto_yellow.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_auto_blue.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_auto_red.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_manual_stop.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_manual_fab.xml
          rm -f V2rayNG/app/src/main/res/drawable/mt_nav.xml
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.*
          rm -f V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.*

          cp /tmp/mobiletina-artwork/white.png  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.png
          cp /tmp/mobiletina-artwork/yellow.png V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.png
          cp /tmp/mobiletina-artwork/blue.png   V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.png
          cp /tmp/mobiletina-artwork/red.png    V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.png
          cp /tmp/mobiletina-artwork/stop.webp  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.webp
          cp /tmp/mobiletina-artwork/fab.webp   V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.webp
          cp /tmp/mobiletina-artwork/nav.png    V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.png

          echo '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.png' | sha256sum -c -
          echo 'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.png' | sha256sum -c -
          echo '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.png' | sha256sum -c -
          echo '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.png' | sha256sum -c -
          echo '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.webp' | sha256sum -c -
          echo 'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.webp' | sha256sum -c -
          echo 'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7  V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.png' | sha256sum -c -

      - name: Verify direct-render layout
        shell: python
        run: |
          from pathlib import Path

          s = Path('V2rayNG/app/src/main/res/layout/activity_main.xml').read_text(encoding='utf-8')

          def block(view_id):
              marker = f'android:id="@+id/{view_id}"'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit(f'{view_id}: id not found')
              start = s.rfind('<com.google.android.material.imageview.ShapeableImageView', 0, pos)
              end = s.find('/>', pos)
              if start < 0 or end < 0:
                  raise SystemExit(f'{view_id}: ShapeableImageView not found')
              return s[start:end + 2]

          auto = block('fab_auto')
          manual = block('fab')

          for item in (
              'android:layout_width="208dp"',
              'android:layout_height="208dp"',
              'android:scaleType="fitCenter"',
              'android:background="@android:color/transparent"',
              'android:padding="0dp"',
              'android:src="@drawable/mt_auto_white"',
          ):
              if item not in auto:
                  raise SystemExit(f'Auto FAB guard failed: {item}')
          if 'tint=' in auto or 'backgroundTint=' in auto:
              raise SystemExit('Auto artwork must not be tinted')

          for item in (
              'android:layout_width="92dp"',
              'android:layout_height="92dp"',
              'android:scaleType="fitCenter"',
              'android:background="@android:color/transparent"',
              'android:padding="0dp"',
              'android:src="@drawable/mt_manual_stop"',
          ):
              if item not in manual:
                  raise SystemExit(f'Manual FAB guard failed: {item}')
          if 'tint=' in manual or 'backgroundTint=' in manual:
              raise SystemExit('Manual artwork must not be tinted')

          if 'android:id="@+id/btn_smart_connect"' not in s or 'android:layout_height="50dp"' not in s:
              raise SystemExit('Auto-connect button guard failed')

          nav = Path('V2rayNG/app/src/main/res/layout/nav_header.xml').read_text(encoding='utf-8')
          if 'android:scaleType="fitCenter"' not in nav or '@drawable/mt_nav' not in nav:
              raise SystemExit('Drawer artwork guard failed')

      - name: Commit exact artwork source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add -A V2rayNG/app/src/main/res/drawable V2rayNG/app/src/main/res/drawable-nodpi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact original MobileTina artwork"
            git push origin HEAD:agent/mobiletina-2.0.15-base
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.0
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          path = Path('V2rayNG/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = 'android {\n'
          if marker not in text:
              raise SystemExit('android block not found')
          if 'ndkVersion = "28.2.13676358"' not in text:
              path.write_text(text.replace(marker, marker + '    ndkVersion = "28.2.13676358"\n', 1), encoding='utf-8')
          PY

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: mobiletina-2015-libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: mobiletina-2015-libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download original 2.0.15 libv2ray
        uses: robinraju/release-downloader@v1.12
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build ARMv7 APK
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a

      - name: Commit successful build marker
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- V2rayNG/app/build.gradle.kts
          mkdir -p .github/verification
          {
            echo 'MobileTina exact user artwork restored without conversion and verified by ARMv7 build'
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Source commit: $GITHUB_SHA"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'Auto FAB: 208dp; Manual FAB: 92dp; Auto-connect button: 50dp'
            echo 'Artwork source: exact Photo.zip SHA-256 154d8204f0a3b4db792387fbd8d0c78f07038a84ca2a2f69d04e5767e87e6467'
          } > .github/verification/mobiletina-exact-original-artwork-build-ok.txt
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add .github/verification/mobiletina-exact-original-artwork-build-ok.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Verify exact original MobileTina artwork ARMv7 build"
            git push origin HEAD:agent/mobiletina-2.0.15-base
          fi

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.0.15-armeabi-v7a-exact-original-artwork
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
          if-no-files-found: error
