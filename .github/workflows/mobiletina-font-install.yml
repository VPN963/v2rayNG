name: Install MobileTina custom font

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-font-install.yml

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Rebuild supplied text.ttf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/src/main/res/font
          cat .github/fontparts/text.xz.b64.part1 \
              .github/fontparts/text.xz.b64.part2 \
              .github/fontparts/text.xz.b64.part3 \
            | base64 -d > /tmp/text.ttf.xz
          xz -dc /tmp/text.ttf.xz > V2rayNG/app/src/main/res/font/text.ttf
          echo "2cb6f2f674c1bfce31ea046dd69edfeb9a52b408ba28a6407d28364c2a90fba6  V2rayNG/app/src/main/res/font/text.ttf" | sha256sum -c -

      - name: Make font global in app theme
        shell: python
        run: |
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/res/values/themes.xml')
          s = p.read_text()
          marker = '<style name="AppThemeBase" parent="Theme.Material3.DayNight">'
          if marker not in s:
              raise SystemExit('AppThemeBase not found')
          if '<item name="fontFamily">@font/text</item>' not in s:
              s = s.replace(marker, marker + '\n        <item name="fontFamily">@font/text</item>\n        <item name="android:fontFamily">@font/text</item>', 1)
          p.write_text(s)

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main/res/font/text.ttf V2rayNG/app/src/main/res/values/themes.xml
          git diff --cached --check
          git commit -m "Apply supplied text font globally"
          git push origin HEAD:agent/mobiletina-2.0.15-base
