name: MobileTina HQ artwork

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-hq-artwork.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Restore original uploaded artwork without recompression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobiletina_hq
          base64 -d .github/hq/Photo.zip.b64 > /tmp/Photo.zip
          unzip -q -o /tmp/Photo.zip -d /tmp/mobiletina_hq

          RES=V2rayNG/app/src/main/res/drawable-nodpi
          mkdir -p "$RES"

          # Remove the previously aggressively-compressed WebP variants.
          rm -f "$RES/mt_auto_white.webp" \
                "$RES/mt_auto_yellow.webp" \
                "$RES/mt_auto_blue.webp" \
                "$RES/mt_auto_red.webp" \
                "$RES/mt_nav.webp"

          # Copy the exact original high-resolution files supplied by the user.
          cp /tmp/mobiletina_hq/white.png  "$RES/mt_auto_white.png"
          cp /tmp/mobiletina_hq/yellow.png "$RES/mt_auto_yellow.png"
          cp /tmp/mobiletina_hq/blue.png   "$RES/mt_auto_blue.png"
          cp /tmp/mobiletina_hq/red.png    "$RES/mt_auto_red.png"
          cp /tmp/mobiletina_hq/nav.png    "$RES/mt_nav.png"
          cp /tmp/mobiletina_hq/stop.webp  "$RES/mt_manual_stop.webp"
          cp /tmp/mobiletina_hq/fab.webp   "$RES/mt_manual_fab.webp"

          # Verify originals were not altered.
          test "$(stat -c%s "$RES/mt_auto_white.png")"  -eq 78322
          test "$(stat -c%s "$RES/mt_auto_yellow.png")" -eq 110665
          test "$(stat -c%s "$RES/mt_auto_blue.png")"   -eq 97925
          test "$(stat -c%s "$RES/mt_auto_red.png")"    -eq 87264
          test "$(stat -c%s "$RES/mt_nav.png")"         -eq 31295
          test "$(stat -c%s "$RES/mt_manual_stop.webp")" -eq 20250
          test "$(stat -c%s "$RES/mt_manual_fab.webp")"  -eq 28332

      - name: Enlarge both FABs and preserve dock spacing
        shell: python
        run: |
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/res/layout/activity_main.xml')
          s = p.read_text()

          # Auto FAB: 172 -> 188 dp, full-resolution artwork fills the circular button.
          s = s.replace('android:layout_width="172dp"\n                        android:layout_height="172dp"',
                        'android:layout_width="188dp"\n                        android:layout_height="188dp"', 1)
          s = s.replace('app:fabCustomSize="172dp"\n                        app:maxImageSize="172dp"',
                        'app:fabCustomSize="188dp"\n                        app:maxImageSize="188dp"', 1)

          # Manual dock: enlarge 58 -> 68 dp while maintaining clean gaps.
          s = s.replace('android:layout_height="134dp"\n                    android:clipChildren="false"',
                        'android:layout_height="148dp"\n                    android:clipChildren="false"', 1)
          s = s.replace('android:layout_height="102dp"\n                        android:layout_gravity="bottom"',
                        'android:layout_height="114dp"\n                        android:layout_gravity="bottom"', 1)
          s = s.replace('android:layout_width="58dp"\n                        android:layout_height="58dp"',
                        'android:layout_width="68dp"\n                        android:layout_height="68dp"', 1)
          s = s.replace('app:fabCustomSize="58dp"\n                        app:maxImageSize="58dp"',
                        'app:fabCustomSize="68dp"\n                        app:maxImageSize="68dp"', 1)
          s = s.replace('android:layout_marginTop="62dp"', 'android:layout_marginTop="72dp"', 1)
          s = s.replace('android:layout_marginTop="106dp"', 'android:layout_marginTop="118dp"', 1)

          p.write_text(s)

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main/res/drawable-nodpi \
                  V2rayNG/app/src/main/res/layout/activity_main.xml
          git diff --cached --check
          git commit -m "Restore original HQ artwork and enlarge FABs"
          git push origin HEAD:agent/mobiletina-2.0.15-base
