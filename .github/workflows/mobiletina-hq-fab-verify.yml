name: MobileTina HQ artwork and ARMv7 verify

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-hq-fab-verify.yml

permissions:
  contents: write

jobs:
  hq-build-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobiletina-2.0.15-base
          submodules: recursive
          fetch-depth: 0

      - name: Preserve artwork at native density
        shell: python
        run: |
          from pathlib import Path
          import struct

          root = Path('V2rayNG/app/src/main/res')
          target = root / 'drawable-nodpi'
          target.mkdir(parents=True, exist_ok=True)

          stems = [
              'mt_auto_white',
              'mt_auto_yellow',
              'mt_auto_blue',
              'mt_auto_red',
              'mt_manual_stop',
              'mt_manual_fab',
              'mt_nav',
          ]

          report = []
          for stem in stems:
              matches = [
                  p for p in root.rglob(stem + '.*')
                  if p.is_file() and '/values' not in p.as_posix()
              ]
              if not matches:
                  raise SystemExit(f'Missing artwork resource: {stem}')

              # Keep the largest existing source byte-for-byte. This avoids
              # accidentally selecting a previously downscaled density copy.
              best = max(matches, key=lambda p: p.stat().st_size)
              data = best.read_bytes()
              suffix = best.suffix.lower()
              destination = target / f'{stem}{suffix}'

              for p in matches:
                  if p.exists():
                      p.unlink()
              destination.write_bytes(data)

              dims = 'unknown'
              if suffix == '.png' and len(data) >= 24 and data[:8] == b'\x89PNG\r\n\x1a\n':
                  width, height = struct.unpack('>II', data[16:24])
                  dims = f'{width}x{height}'
              report.append(f'{stem}: {destination} | {len(data)} bytes | {dims}')

          Path('.github/verification').mkdir(parents=True, exist_ok=True)
          Path('.github/verification/mobiletina-artwork-report.txt').write_text(
              '\n'.join(report) + '\n', encoding='utf-8'
          )
          print('\n'.join(report))

      - name: Verify direct-render UI geometry
        shell: python
        run: |
          from pathlib import Path

          p = Path('V2rayNG/app/src/main/res/layout/activity_main.xml')
          text = p.read_text(encoding='utf-8')
          required = (
              'com.google.android.material.imageview.ShapeableImageView',
              '@+id/fab_auto',
              '@+id/fab',
              'android:layout_width="192dp"',
              'android:layout_height="192dp"',
              'android:layout_width="92dp"',
              'android:layout_height="92dp"',
              'android:scaleType="fitCenter"',
              'android:layout_height="50dp"',
              'android:minHeight="50dp"',
              'android:minWidth="156dp"',
              'android:textSize="16sp"',
              '@drawable/mt_auto_white',
              '@drawable/mt_manual_stop',
          )
          for item in required:
              if item not in text:
                  raise SystemExit(f'UI regression guard failed: {item}')

          if 'app:fabCustomSize=' in text or 'app:maxImageSize=' in text:
              raise SystemExit('Legacy Material FAB image-size constraint is still present')

      - name: Check source diff
        run: |
          git diff --check
          git status --short
          cat .github/verification/mobiletina-artwork-report.txt

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.0
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          path = Path('V2rayNG/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = 'android {\n'
          if marker not in text:
              raise SystemExit('android block not found')
          if 'ndkVersion = "28.2.13676358"' not in text:
              text = text.replace(marker, marker + '    ndkVersion = "28.2.13676358"\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: mobiletina-2015-libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: mobiletina-2015-libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download original 2.0.15 libv2ray
        uses: robinraju/release-downloader@v1.12
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build ARMv7 APK
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a

      - name: Commit verified artwork layout and build marker
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- V2rayNG/app/build.gradle.kts
          printf 'MobileTina HQ artwork + enlarged controls verified by ARMv7 build\nWorkflow run: %s\nSource commit: %s\nUTC: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .github/verification/mobiletina-hq-fab-build-ok.txt
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add -A V2rayNG/app/src/main/res .github/verification
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m "Verify HQ MobileTina artwork and enlarged controls"
            git push origin HEAD:agent/mobiletina-2.0.15-base
          fi

      - name: Upload verified ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.0.15-base-armeabi-v7a-hq-controls
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
          if-no-files-found: error
