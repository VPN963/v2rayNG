name: Monitor MobileTina exact artwork build

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-monitor-exact-artwork.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Find and wait for exact artwork workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mobiletina-exact-original-artwork-verify.yml/runs?branch=agent%2Fmobiletina-2.0.15-base&event=workflow_dispatch&per_page=10"
          for i in $(seq 1 30); do
            json=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$API")
            run_id=$(printf '%s' "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workflow_runs"][0]["id"] if d.get("workflow_runs") else "")')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "${run_id:-}"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

          status=""
          conclusion=""
          html_url=""
          for i in $(seq 1 90); do
            json=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')
            conclusion=$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            html_url=$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url", ""))')
            echo "Exact artwork run $run_id: status=$status conclusion=$conclusion"
            [ "$status" = "completed" ] && break
            sleep 10
          done

          mkdir -p .github/verification
          {
            echo "Run ID: $run_id"
            echo "Status: $status"
            echo "Conclusion: $conclusion"
            echo "URL: $html_url"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/verification/mobiletina-exact-artwork-run-status.txt

          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add .github/verification/mobiletina-exact-artwork-run-status.txt
          git commit -m "Record exact artwork ARMv7 run status"
          git push origin HEAD:agent/mobiletina-2.0.15-base

          [ "$status" = "completed" ]
          [ "$conclusion" = "success" ]
