name: MobileTina one-shot source patch

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-one-shot-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Apply MobileTina source refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: source pattern not found")
              return text.replace(old, new, 1)

          root = Path('V2rayNG/app/src/main')

          # MainActivity: exact centered mode labels + cancellable Smart Connect.
          p = root / 'java/com/v2ray/ang/ui/MainActivity.kt'
          s = p.read_text()

          if 'private var smartConnectJob: kotlinx.coroutines.Job? = null' not in s:
              s = one(
                  s,
                  '    private var lastConnectedPing: String? = null\n',
                  '    private var lastConnectedPing: String? = null\n    private var smartConnectJob: kotlinx.coroutines.Job? = null\n',
                  'smartConnectJob field',
              )

          if 'private fun createModeTab(textRes: Int): TabLayout.Tab' not in s:
              pattern = re.compile(r'    private fun setupModeTabs\(\) \{.*?\n    \}\n\n    private fun setMode', re.S)
              replacement = '''    private fun setupModeTabs() {
              binding.modeTabs.removeAllTabs()
              binding.modeTabs.addTab(createModeTab(R.string.mobiletina_mode_auto), true)
              binding.modeTabs.addTab(createModeTab(R.string.mobiletina_mode_manual), false)
              binding.modeTabs.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                  override fun onTabSelected(tab: TabLayout.Tab) = setMode(tab.position, updateTab = false)
                  override fun onTabUnselected(tab: TabLayout.Tab) = Unit
                  override fun onTabReselected(tab: TabLayout.Tab) = Unit
              })
              binding.modeContainer.setOnModeSwipeListener { direction ->
                  if (direction > 0) setMode(MODE_MANUAL) else setMode(MODE_AUTO)
              }
              setMode(MODE_AUTO)
          }

          private fun createModeTab(textRes: Int): TabLayout.Tab {
              val label = TextView(this).apply {
                  setText(textRes)
                  gravity = android.view.Gravity.CENTER
                  textAlignment = View.TEXT_ALIGNMENT_CENTER
                  layoutDirection = View.LAYOUT_DIRECTION_RTL
                  textSize = 17f
                  setTextColor(ContextCompat.getColor(this@MainActivity, R.color.colorTextPrimary))
                  layoutParams = android.view.ViewGroup.LayoutParams(
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT
                  )
              }
              return binding.modeTabs.newTab().setText(textRes).setCustomView(label)
          }

          private fun setMode'''
              s, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'setupModeTabs: expected one block, found {n}')

          if 'if (smartConnecting) {\n            cancelSmartConnect()' not in s:
              s = one(
                  s,
                  '        if (smartConnecting) return\n\n        smartConnecting = true',
                  '        if (smartConnecting) {\n            cancelSmartConnect()\n            return\n        }\n\n        smartConnecting = true',
                  'smart connect second tap',
              )

          if 'smartConnectJob = lifecycleScope.launch {' not in s:
              s = one(
                  s,
                  '        refreshSelectedServerUi()\n\n        lifecycleScope.launch {\n            // Do not consume the six-second Real Delay window while a subscription refresh is still running.',
                  '        refreshSelectedServerUi()\n\n        smartConnectJob?.cancel()\n        smartConnectJob = lifecycleScope.launch {\n            // Do not consume the six-second Real Delay window while a subscription refresh is still running.',
                  'smart connect job assignment',
              )

          if 'private fun cancelSmartConnect()' not in s:
              cancel_method = '''    private fun cancelSmartConnect() {
              smartConnectJob?.cancel()
              smartConnectJob = null
              mainViewModel.cancelRealPing()
              pendingSmartVpnPermission = false
              smartConnecting = false
              smartConnectionFailed = false
              smartCountdownSeconds = 0
              // Covers the tiny window where the service start was already dispatched but
              // the UI has not received the running broadcast yet.
              V2RayServiceManager.stopVService(this)
              refreshSelectedServerUi()
          }

          '''
              s = one(
                  s,
                  '    private fun requestVpnPermissionAndStart(isSmartConnect: Boolean) {',
                  cancel_method + '    private fun requestVpnPermissionAndStart(isSmartConnect: Boolean) {',
                  'cancelSmartConnect insertion',
              )
          p.write_text(s)

          # Main layout: move automatic controls slightly lower and eliminate hidden tab padding.
          p = root / 'res/layout/activity_main.xml'
          s = p.read_text()
          if 'android:paddingTop="52dp"' in s:
              s = s.replace('android:paddingTop="52dp"', 'android:paddingTop="72dp"', 1)
          elif 'android:paddingTop="72dp"' not in s:
              raise SystemExit('auto panel padding: neither old nor new value found')

          if 'app:tabPaddingStart="0dp"' not in s:
              s = one(
                  s,
                  '                app:tabMode="fixed"\n                app:tabRippleColor="@android:color/transparent" />',
                  '                app:tabMode="fixed"\n                app:tabPaddingStart="0dp"\n                app:tabPaddingEnd="0dp"\n                app:tabPaddingTop="0dp"\n                app:tabPaddingBottom="0dp"\n                app:tabRippleColor="@android:color/transparent" />',
                  'mode tab padding',
              )
          p.write_text(s)

          # Main toolbar menu: Service Restart remains defined but is invisible.
          p = root / 'res/menu/menu_main.xml'
          s = p.read_text()
          service_block = re.compile(
              r'(<item\s*\n\s*android:id="@\+id/service_restart"\s*\n\s*android:title="@string/title_service_restart")(?P<tail>\s*\n\s*app:showAsAction="never"\s*/>)',
              re.S,
          )
          match = service_block.search(s)
          if match and 'android:visible="false"' not in match.group(0):
              s = service_block.sub(r'\1\n        android:visible="false"\g<tail>', s, count=1)
          elif not match and 'android:id="@+id/service_restart"' not in s:
              raise SystemExit('service restart menu item missing')
          p.write_text(s)

          # Drawer: each visible destination in a separate group => Material divider between rows.
          p = root / 'res/menu/menu_drawer.xml'
          p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              tools:showIn="navigation_view">

              <group android:id="@+id/group_mobiletina_store">
                  <item
                      android:id="@+id/mobiletina_store_about"
                      android:icon="@drawable/ic_about_24dp"
                      android:title="@string/mobiletina_store_about_title" />
              </group>

              <group android:id="@+id/group_mobiletina_per_app">
                  <item
                      android:id="@+id/per_app_proxy_settings"
                      android:icon="@drawable/ic_per_apps_24dp"
                      android:title="@string/per_app_proxy_settings" />
              </group>

              <group android:id="@+id/group_mobiletina_settings">
                  <item
                      android:id="@+id/settings"
                      android:icon="@drawable/ic_settings_24dp"
                      android:title="@string/title_settings" />
              </group>

              <group android:id="@+id/group_mobiletina_reset">
                  <item
                      android:id="@+id/mobiletina_reset"
                      android:icon="@drawable/ic_delete_24dp"
                      android:title="@string/mobiletina_delete_vpn" />
              </group>

              <group android:id="@+id/group_mobiletina_hidden" android:visible="false">
                  <item android:id="@+id/routing_setting" android:title="@string/routing_settings_title" />
                  <item android:id="@+id/user_asset_setting" android:title="@string/title_user_asset_setting" />
                  <item android:id="@+id/promotion" android:title="@string/title_pref_promotion" />
                  <item android:id="@+id/logcat" android:title="@string/title_logcat" />
                  <item android:id="@+id/check_for_update" android:title="@string/update_check_for_update" />
                  <item android:id="@+id/about" android:title="@string/title_about" />
              </group>
          </menu>
          ''')

          # Scanner preference: default enabled, but a stored user choice of false remains respected.
          p = root / 'res/xml/pref_settings.xml'
          s = p.read_text()
          if 'android:defaultValue="true"\n            android:key="pref_start_scan_immediate"' not in s:
              s = one(
                  s,
                  '        <CheckBoxPreference\n            android:key="pref_start_scan_immediate"',
                  '        <CheckBoxPreference\n            android:defaultValue="true"\n            android:key="pref_start_scan_immediate"',
                  'scan preference default',
              )
          p.write_text(s)

          p = root / 'java/com/v2ray/ang/ui/ScannerActivity.kt'
          s = p.read_text()
          old = 'MmkvManager.decodeSettingsBool(AppConfig.PREF_START_SCAN_IMMEDIATE)'
          new = 'MmkvManager.decodeSettingsBool(AppConfig.PREF_START_SCAN_IMMEDIATE, true)'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('scanner runtime setting pattern missing')
          p.write_text(s)

          # Remove generic Start services toast. Proxy-sharing warning is intentionally retained.
          p = root / 'java/com/v2ray/ang/handler/V2RayServiceManager.kt'
          s = p.read_text()
          old = '''        if (MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)) {
              context.toast(R.string.toast_warning_pref_proxysharing_short)
          } else {
              context.toast(R.string.toast_services_start)
          }'''
          new = '''        if (MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)) {
              context.toast(R.string.toast_warning_pref_proxysharing_short)
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'context.toast(R.string.toast_services_start)' in s:
              # Whitespace-tolerant fallback.
              s, n = re.subn(
                  r'        if \(MmkvManager\.decodeSettingsBool\(AppConfig\.PREF_PROXY_SHARING\)\) \{\s*context\.toast\(R\.string\.toast_warning_pref_proxysharing_short\)\s*\} else \{\s*context\.toast\(R\.string\.toast_services_start\)\s*\}',
                  '        if (MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)) {\n            context.toast(R.string.toast_warning_pref_proxysharing_short)\n        }',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('start services toast block not matched')
          p.write_text(s)
          PY

      - name: Commit source refinements
        shell: bash
        run: |
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine MobileTina controls and cancellable smart connect"
          git push origin HEAD:agent/mobiletina-2.0.15-base
