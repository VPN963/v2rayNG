name: MobileTina UI and manual-start patch

on:
  push:
    branches:
      - agent/mobiletina-2.0.15-base
    paths:
      - .github/workflows/mobiletina-ui-speed-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobiletina-2.0.15-base
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/mobiletina_ui_speed_patch.py

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish mode controls and speed manual startup"
          git push origin HEAD:agent/mobiletina-2.0.15-base
